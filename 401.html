<!doctype html><html lang="en" dir="ltr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="assets/js/theme.js?v=5"></script>
<script src="assets/js/i18n.js?v=5"></script>
<title>401 — AdminKit</title>
<link rel="stylesheet" href="assets/vendor/fontawesome/all.min.css?v=5">
<link rel="stylesheet" href="assets/css/theme.css?v=5">
<link rel="stylesheet" href="assets/css/components.css?v=5"></head>
<body class="err" data-err="401">
<nav class="err-nav">
<a class="err-brand" href="homepage.html"><span class="brand-mark" style="width:34px;height:34px;font-size:15px;border-radius:11px"><i class="fa-solid fa-layer-group"></i></span><span data-i18n="appName">AdminKit</span></a>
<span class="spacer"></span>
<button class="err-chip" id="errTheme" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke"></i> <span>Theme</span></button>
<button class="err-chip" data-errlang="en">EN</button>
<button class="err-chip" data-errlang="fa">فا</button>
</nav>
<main class="err-main"><div class="err-inner">
<div class="err-mark"><i class="fa-solid fa-lock"></i></div>
<p class="err-pill"><span class="dot"></span>Error 401</p>
<h1 class="err-giant">401</h1>
<h2 class="err-title" data-i18n="err401t">Unauthorized</h2>
<p class="err-desc" data-i18n="err401d">You need to sign in to see this page.</p>
<p class="err-path" id="errPath" hidden><i class="fa-solid fa-link" style="font-size:11px"></i><span></span></p>
<div class="err-actions"><a class="btn btn-primary" href="login.html"><i class="fa-solid fa-right-to-bracket"></i><span data-i18n="loginT">Login</span></a><a class="btn btn-ghost" href="homepage.html"><i class="fa-solid fa-house"></i><span data-i18n="backHome">Back to homepage</span></a></div>
</div></main>
<footer class="err-foot"><span><i class="fa-solid fa-layer-group" style="color:var(--primary)"></i> <span data-i18n="appName">AdminKit</span></span><span class="muted" data-i18n="footerTag">Offline-first admin template. No CDN, no build step.</span><nav><a href="homepage.html"><span data-i18n="backHome">Back to homepage</span></a><a href="tickets.html"><span data-i18n="tickets">Tickets</span></a></nav></footer>
<script>
(function(){
try{ThemeStore.apply();var s=ThemeStore.get();if(window.I18N)I18N.apply(s.lang);}catch(e){}
function paintChips(){try{var l=ThemeStore.get().lang;document.querySelectorAll('[data-errlang]').forEach(b=>b.classList.toggle('on',b.dataset.errlang===l));}catch(e){}}
paintChips();
var th=document.getElementById('errTheme');
if(th)th.onclick=function(){try{var cur=ThemeStore.effectiveTheme();ThemeStore.set({theme:cur==='dark'?'light':'dark'});}catch(e){}};
document.querySelectorAll('[data-errlang]').forEach(function(b){b.onclick=function(){try{ThemeStore.set({lang:b.dataset.errlang});if(window.I18N)I18N.apply(b.dataset.errlang);}catch(e){}paintChips();};});
try{var p=location.pathname.split('/').pop()||'';if(p&&p!=='401.html'){var w=document.getElementById('errPath');w.hidden=false;w.querySelector('span').textContent='/'+p;}}catch(e){}
document.addEventListener('app:lang',paintChips);
})();
</script>
</body></html>
